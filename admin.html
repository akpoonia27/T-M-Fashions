<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — TM Fashions</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@0,400;0,500;0,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260805" />
</head>
<body class="admin-body">

  <div class="admin-auth">
    <div class="admin-auth__card">
      <div class="admin-auth__brand">TM<span class="brand-mark">F</span>ashions</div>
      <h1 class="admin-auth__title">Admin Panel</h1>
      <p class="admin-auth__sub">Enter your credentials to manage the catalogue.</p>

      <form id="loginForm" class="admin-auth__form" autocomplete="off">
        <div class="admin-field">
          <label for="adminUser">Username</label>
          <input type="text" id="adminUser" placeholder="Username" required />
        </div>
        <div class="admin-field">
          <label for="adminPass">Password</label>
          <input type="password" id="adminPass" placeholder="Password" required />
        </div>
        <button type="submit" class="btn btn--gold btn--block">Sign In</button>
        <p class="admin-auth__error" id="loginError"></p>
      </form>
    </div>
  </div>

  <script>
    // Hardcoded credentials — change these to your own
    const ADMIN = { user: "admin", pass: "tmfashions2024" };

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const u = document.getElementById("adminUser").value.trim();
      const p = document.getElementById("adminPass").value;
      const err = document.getElementById("loginError");
      if (u === ADMIN.user && p === ADMIN.pass) {
        sessionStorage.setItem("tmf_admin", "1");
        window.location.href = "dashboard.html";
      } else {
        err.textContent = "Invalid username or password.";
      }
    });
  </script>
</body>
</html>
